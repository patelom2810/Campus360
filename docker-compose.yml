services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: campus360_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DB_ENGINE=sqlite
      - DATABASE_URL=sqlite:////app/data/processed/warehouse.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./dashboard:/app/dashboard
      - ./genai:/app/genai
      - ./etl:/app/etl
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: campus360_postgres
    environment:
      POSTGRES_USER: campus360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: campus360_warehouse
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus360 -d campus360_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
